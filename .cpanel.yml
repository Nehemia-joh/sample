---
deployment:
  tasks:
    - export DEPLOYPATH=/home/nexabiec/sample.nexabie.co.tz/
    - /bin/cp /home/nexabiec/repositories/sample/index.html $DEPLOYPATH
    - /bin/cp /home/nexabiec/repositories/sample/style.css $DEPLOYPATH
    - /bin/chmod 644 $DEPLOYPATH/index.html
    - /bin/chmod 644 $DEPLOYPATH/style.css
    - /bin/chmod 644 $DEPLOYPATH/.htaccess 2>/dev/null || true
    - /bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} \;
